name: Update TVBox Config

on:
  schedule:
    - cron: '0 2 */3 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install deps
        run: pip install requests
      
      - name: Check sources
        run: python scripts/check_sources.py
      
      - name: Crawl content
        run: python scripts/crawl_content.py
      
      - name: Generate config
        run: python scripts/generate_config.py
      
      - name: Commit to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: update $(date -u +%Y-%m-%d)"
          git push
      
      - name: Sync to Gitee
        run: |
          git remote add gitee https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/angus66669999/tvbox-home.git
          git push gitee main:master --force
